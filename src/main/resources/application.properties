quarkus.application.name=aiup-petclinic

# PostgreSQL on localhost:5432, the server vb-postgres runs. There is no Docker
# here, so Quarkus Dev Services cannot start a database of its own.
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/petclinic

# Flyway owns the schema; Hibernate only maps it.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Development (mvn quarkus:dev): the always-present postgres database, emptied
# and migrated on every start, with the test seed data so there is something to
# look at. The frontend dev server (npm start) proxies /api to port 8080.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
%dev.quarkus.flyway.clean-disabled=false
%dev.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.locations=classpath:db/migration,filesystem:src/test/resources/db/migration

# Tests: the petclinic_test database, emptied and migrated when the test
# application starts. The seed in src/test/resources/db/migration is on the
# test classpath and applies with the schema.
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/petclinic_test
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.http.test-port=0
