<header class="header">
  <button type="button" class="toggle" aria-label="Toggle menu" (click)="drawerOpen.set(!drawerOpen())">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
    </svg>
  </button>
  <img class="logo" src="images/petclinic-logo.svg" alt="PetClinic logo" height="40">
  <h1 class="title">PetClinic</h1>
</header>

<div class="body">
  @if (drawerOpen()) {
    <nav class="drawer" [attr.aria-label]="navLabel">
      @for (item of menu; track item.path) {
        <a [routerLink]="item.path"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: item.path === '/' }">{{ item.label }}</a>
      }
    </nav>
  }

  <main class="page">
    <router-outlet />
  </main>
</div>
